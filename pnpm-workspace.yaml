# pnpm 11 requires an explicit decision for dependency build scripts.
overrides:
  'brace-expansion@1': 1.1.18
  'dompurify@3': 3.4.17
  'js-yaml@4': 4.3.2
  'postcss-selector-parser@6': 6.1.3
  'undici@7': 7.30.1
  'undici@8': 8.12.2
  'path-to-regexp@6': 6.3.0
  'vite@8': 8.3.3
  'zod@4': 4.6.6

allowBuilds:
  # Biome and Sharp are direct development dependencies with native binaries.
  '@biomejs/biome': true
  sharp: true
  # Both packages publish platform-specific binaries, so their install scripts
  # are unnecessary for this project.
  esbuild: false
  unrs-resolver: false
