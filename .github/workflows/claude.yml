name: Claude

# Two jobs:
# - review: an automatic code review when a pull request is opened or marked
#   ready, following .github/claude/pr-review.md.
# - mention: answers `@claude` in PR comments, reviews, and issues. Only people
#   with write access can trigger it; claude-code-action rejects everyone else.
#
# Both read their instructions from the default branch (.ci-trusted), so a
# pull request can't rewrite the instructions that review it. Setup and local
# use: .github/claude/README.md.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  review:
    name: Code Review
    # Fork PRs don't receive repository secrets, so they're skipped rather than
    # failing. Bot-opened PRs (Dependabot) are skipped too.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out review instructions from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          display_report: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read .ci-trusted/.github/claude/pr-review.md and follow it exactly.
            Run link for the summary comment: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

  mention:
    name: Answer @claude
    if: >-
      github.event_name != 'pull_request'
      && github.event.sender.type != 'Bot'
      && contains(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-mention-${{ github.event.comment.id || github.event.review.id || github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      # claude-code-action pushes branches when asked to make changes, so this
      # checkout keeps its credentials.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check out review instructions from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ci-trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Answer the request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          branch_prefix: 'claude/'
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --append-system-prompt "Follow AGENTS.md, including starting every GitHub comment you write with the robot emoji alone on its first line. When asked to review a pull request, read .ci-trusted/.github/claude/pr-review.md and follow it. When asked for an architecture review, follow .ci-trusted/.github/claude/architecture-review.md."
